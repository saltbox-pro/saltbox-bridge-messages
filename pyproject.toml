[project]
name = 'saltbox-bridge-messages'
version = '0.0.1'
description = 'Models of messages to communicate between Salt.Box Core and Bridge components'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = [
    'pydantic~=2.8',
]

[project.optional-dependencies]
dev = [
    'mypy>=1.16.1',
    'pre-commit>=4.2.0',
    'ruff>=0.11.13',
]

[build-system]
requires = ['setuptools>=57.4.0', 'setuptools-scm']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ['saltbox_bridge_messages']

[tool.setuptools.package-data]
saltbox_bridge_messages = ['py.typed']

[tool.ruff]
target-version = 'py310'
line-length = 120

[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true

[tool.ruff.lint]
preview = true
select = [
  'B',      # flake8-bugbear
  'C90',    # mccabe
  'C4',     # flake8-comprehensions
  'DTZ',    # flake8-datetimez https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
  'EM',     # flake8-errmsg
  'UP',     # pyupgrade
  'FA',     # flake8-future-annotations
  'LOG',    # flake8-logging
  'PTH',    # flake8-use-pathlib
  'ASYNC',  #flake8-async
  'G',      # flake8-logging-format
  'E',      # pycodestyle errors
  'F',      # pyflakes
  'I',      # isort
  'S',      # flake8-bandit
  'W',      # pycodestyle warnings
  'N',      # pep8-naming
  'RUF',    # ruff checks
  'TD',     # flake8-todo
]
ignore = [
  'E722',   # Do not use bare except
  'ERA',    # Do not autoremove commented out code
  'N818',   # Error-suffix-on-exception-name
  'UP040',  # Type instead of TypeAlias PEP 695'
  'TD001',  # Invalid TODO tag
  'TD002',  # Author name in TODO
  'TD003',  # Found TODO in code
  'TD004',  # Missing colon in TODO
  'UP017',  # Use datetime.UTC alias (not available for 3.10)
]
fixable = ['ALL']
unfixable = [
  'F401',   # Unused import
  'F841',   # Unused variable
  'UP035',  # Deprecated import
]

[tool.mypy]
check_untyped_defs = true
plugins = ['pydantic.mypy']
python_version = '3.10'
ignore_missing_imports = false
color_output = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ['venv/', '.venv/', 'tests/*']
strict = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
implicit_reexport = false
show_error_codes = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
